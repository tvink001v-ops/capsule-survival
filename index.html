                text-shadow:1px 1px 2px #000; opacity:0.6; z-index:5; pointer-events:none; }

  /* Хотбар (первые 6 слотов) */

  /* Инвентарь 6×3 */

  #wakeOverlay {

<script type="module">
import * as THREE from 'three';

const GRASS_RADIUS = 45;
const BEACH_RADIUS = 60;
const WATER_Y = -0.3;

const SPAWN_POS = { x: 0, z: 54 };
const TREE_HP = 3;

const HOTBAR_SIZE = 6;

// ============ УСТРОЙСТВО ============
function detectDevice() {
  const ua = navigator.userAgent;
  const platform = navigator.platform || '';
  const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  const res = `${screen.width || innerWidth}x${screen.height || innerHeight}`;
  if (/iPhone/i.test(ua)) return { icon: '📱', label: 'iPhone', detail: res };
  if (/iPad/i.test(ua) || (/Macintosh/i.test(ua) && touch)) return { icon: '📱', label: 'iPad', detail: res };
  if (/Android/i.test(ua)) return { icon: '📱', label: /Mobile/i.test(ua) ? 'Android' : 'Android-планшет', detail: res };
  if (/Windows/i.test(ua) || /Win32|Win64|Windows/i.test(platform)) return { icon: '🖥️', label: 'Windows ПК', detail: res };
  if (/Macintosh|Mac OS X/i.test(ua)) return { icon: '💻', label: 'Mac', detail: res };
  if (/Linux/i.test(ua)) return { icon: '🐧', label: 'Linux', detail: res };
  return { icon: '❓', label: 'Устройство', detail: res };
}

const DEVICE = detectDevice();
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || DEVICE.label.includes('Android') || DEVICE.label.includes('iPhone') || DEVICE.label.includes('iPad');

document.getElementById('deviceInfo').textContent = `${DEVICE.icon} ${DEVICE.label} · ${DEVICE.detail}`;
document.getElementById('hint').innerHTML = isMobile
  ? '📱 Джойстик · Свайп — обзор<br>🦘 JUMP · ⛏ HIT<br>🎒 Q — инвентарь'
  : '🖱️ WASD · Мышь · Space<br>⛏ ЛКМ — удар · Q — инвентарь<br>1-6 — слоты · V — вид';

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ============ ПРЕДМЕТЫ ============
const ITEMS = {
  stone: { icon: '🪨', name: 'Камень', type: 'tool' },

};

// slots[i] = { id, count } | null
const slots = new Array(INV_SIZE).fill(null);
let activeSlot = 0;
let selectedInvSlot = -1; // для перемещения

slots[0] = { id: 'stone', count: 1 };

function getActiveItem() {
  const s = slots[activeSlot];
  return s ? s.id : null;
}

function addItem(id, count = 1) {
  // Сначала в существующий стак
  for (let i = 0; i < INV_SIZE; i++) {
    if (slots[i] && slots[i].id === id) {
      slots[i].count += count;

      return;
    }

  // Затем в свободный слот (приоритет — хотбар, потом остальное)
  const order = [...Array(HOTBAR_SIZE).keys(), ...Array(INV_SIZE - HOTBAR_SIZE).keys()].map(
    (v, i) => i < HOTBAR_SIZE ? v : HOTBAR_SIZE + v
  );
  // Проще: сначала 0..5, потом 6..17
  for (let i = 0; i < HOTBAR_SIZE; i++) {
    if (!slots[i]) { slots[i] = { id, count }; renderHotbar(); renderInventory(); return; }
  }
  for (let i = HOTBAR_SIZE; i < INV_SIZE; i++) {
    if (!slots[i]) { slots[i] = { id, count }; renderHotbar(); renderInventory(); return; }
  }
  showToast('Инвентарь полон');
}

// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 220);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isMobile;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 20);
if (!isMobile) {
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
}
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// ============ ОСТРОВ ============
const water = new THREE.Mesh(
  new THREE.CircleGeometry(250, 64),
  new THREE.MeshStandardMaterial({ color: 0x2e7bc4, roughness: 0.4, metalness: 0.1 })

water.rotation.x = -Math.PI / 2;
water.position.y = WATER_Y;

const sand = new THREE.Mesh(

sand.rotation.x = -Math.PI / 2;
sand.receiveShadow = !isMobile;
scene.add(sand);

const island = new THREE.Mesh(
  new THREE.CircleGeometry(GRASS_RADIUS, 64),

);
island.rotation.x = -Math.PI / 2;
island.position.y = 0.01;
island.receiveShadow = !isMobile;
scene.add(island);

const patchMat = new THREE.MeshStandardMaterial({ color: 0x3d7a2f, roughness: 0.9 });
{
  const rng = mulberry32(12345);
  for (let i = 0; i < 30; i++) {
    const angle = rng() * Math.PI * 2;
    const r = rng() * (GRASS_RADIUS - 8);
    const s = 2 + rng() * 4;
    const patch = new THREE.Mesh(new THREE.CircleGeometry(s, 16), patchMat);
    patch.rotation.x = -Math.PI / 2;
    patch.position.set(Math.cos(angle) * r, 0.02, Math.sin(angle) * r);
    scene.add(patch);
  }
}

// ============ ДЕРЕВЬЯ ============
const trees = [];
const treeMap = new Map();

function createTreeMesh(x, z, scale) {
  const tree = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.9 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0x2d6a2d, roughness: 0.8 });
  const shadow = !isMobile;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3 * scale, 0.4 * scale, 4 * scale, 8),
    trunkMat
  );
  trunk.position.y = 2 * scale;
  trunk.castShadow = shadow;
  tree.add(trunk);

  const crownPositions = [
    { x: 0, y: 4.5 * scale, z: 0, r: 1.6 * scale },
    { x: 0.8 * scale, y: 3.8 * scale, z: 0.3 * scale, r: 1.2 * scale },
    { x: -0.6 * scale, y: 4.2 * scale, z: -0.4 * scale, r: 1.1 * scale },
  ];
  for (const p of crownPositions) {
    const crown = new THREE.Mesh(new THREE.SphereGeometry(p.r, 8, 6), leafMat);
    crown.position.set(p.x, p.y, p.z);
    crown.castShadow = shadow;
    tree.add(crown);
  }

  tree.position.set(x, 0, z);
  return tree;
}

{
  const rng = mulberry32(TREE_SEED);
  const treeCount = 14;
  for (let i = 0; i < treeCount; i++) {
    const angle = (i / treeCount) * Math.PI * 2 + rng() * 0.3;
    const r = 15 + rng() * (GRASS_RADIUS - 20);
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const s = 0.8 + rng() * 0.6;
    const id = `tree_${i}`;
    const mesh = createTreeMesh(x, z, s);
    scene.add(mesh);
    const treeData = {
      id, x, z, scale: s, hp: TREE_HP, group: mesh,
      collider: { x, z, r: TREE_COLLIDE_R * s }
    };
    trees.push(treeData);
    treeMap.set(id, treeData);
  }
}

function removeTreeById(id) {
  const t = treeMap.get(id);
  if (!t) return;
  scene.remove(t.group);
  treeMap.delete(id);
  const idx = trees.indexOf(t);
  if (idx >= 0) trees.splice(idx, 1);
}

function damageTree(id, fromId) {
  const t = treeMap.get(id);
  if (!t) return;
  t.hp -= 1;
  t.group.rotation.z = 0.15;
  setTimeout(() => { if (t.group) t.group.rotation.z = 0; }, 100);
  if (t.hp <= 0) {
    removeTreeById(id);
    if (fromId === player.id) {
      addItem('wood', 1);
      showToast('+1 🪵 Древесина');
    }
  }
}

// ============ ИГРОК ============
const player = {
  pos: new THREE.Vector3(SPAWN_POS.x, 1.7, SPAWN_POS.z),
  vel: new THREE.Vector3(),
  yaw: Math.PI,
  pitch: -0.15,

};

// ============ ВВОД ПК ============
const keys = {};
let mouseLocked = false;
addEventListener('keydown', e => {

});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousemove', e => {
  if (!mouseLocked || !player.awake) return;

});
document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === renderer.domElement;
});

renderer.domElement.addEventListener('click', () => {

// ============ ТАЧ ============
const touchState = {
  moveX: 0, moveY: 0, jump: false,
  joyId: null, lookId: null,
  joyStart: { x: 0, y: 0 }, lookLast: { x: 0, y: 0 },
};
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const lookZone = document.getElementById('lookZone');
const jumpBtn = document.getElementById('jumpBtn');

function enableTouchUI() {
  touchUI.classList.add('active');
  joyBase.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!player.awake) return;
    const t = e.changedTouches[0];
    touchState.joyId = t.identifier;
    const r = joyBase.getBoundingClientRect();
    touchState.joyStart.x = r.left + r.width/2;
    touchState.joyStart.y = r.top + r.height/2;
    updateJoystick(t.clientX, t.clientY);
  }, { passive: false });
  lookZone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!player.awake) return;
    const t = e.changedTouches[0];
    touchState.lookId = t.identifier;
    touchState.lookLast.x = t.clientX;
    touchState.lookLast.y = t.clientY;
  }, { passive: false });
  jumpBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!player.awake) return;
    touchState.jump = true;
    jumpBtn.classList.add('pressed');
  }, { passive: false });
  jumpBtn.addEventListener('touchend', e => {
    e.preventDefault();
    touchState.jump = false;
    jumpBtn.classList.remove('pressed');
  }, { passive: false });
  hitBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!player.awake) return;
    hitBtn.classList.add('pressed');
    tryHit();
  }, { passive: false });
  hitBtn.addEventListener('touchend', e => {
    e.preventDefault();
    hitBtn.classList.remove('pressed');
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!player.awake) return;
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.joyId) {
        updateJoystick(t.clientX, t.clientY);
      } else if (t.identifier === touchState.lookId) {
        const dx = t.clientX - touchState.lookLast.x;
        const dy = t.clientY - touchState.lookLast.y;
        touchState.lookLast.x = t.clientX;
        touchState.lookLast.y = t.clientY;
        player.yaw   -= dx * 0.005;
        player.pitch -= dy * 0.005;
        player.pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, player.pitch));
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchState.joyId) {
        touchState.joyId = null; touchState.moveX = 0; touchState.moveY = 0;
        joyKnob.style.transform = '';
      }
      if (t.identifier === touchState.lookId) touchState.lookId = null;
    }
  }, { passive: false });
  document.addEventListener('touchcancel', () => {
    touchState.joyId = null; touchState.lookId = null;
    touchState.moveX = 0; touchState.moveY = 0;
    touchState.jump = false;
    joyKnob.style.transform = '';
    jumpBtn.classList.remove('pressed');
    hitBtn.classList.remove('pressed');
  });
}
function updateJoystick(cx, cy) {
  let dx = cx - touchState.joyStart.x;
  let dy = cy - touchState.joyStart.y;
  const maxR = 50;
  const d = Math.hypot(dx, dy);
  if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  touchState.moveX = dx / maxR;
  touchState.moveY = dy / maxR;
}

// ============ UI: ХОТБАР + ИНВЕНТАРЬ ============
function slotHTML(item, keyLabel) {
  if (!item) return `<span class="key">${keyLabel || ''}</span>`;
  const info = ITEMS[item.id];
  let h = `<span class="key">${keyLabel || ''}</span>`;
  h += `<div class="icon">${info.icon}</div>`;
  if (item.count > 1) h += `<span class="count">${item.count}</span>`;
  return h;
}

function renderHotbar() {
  document.querySelectorAll('#hotbar .slot').forEach((el, i) => {
    el.innerHTML = slotHTML(slots[i], i + 1);
    el.classList.toggle('active', i === activeSlot);
    el.classList.toggle('empty', !slots[i]);
  });
}

function renderInventory() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '';
  for (let i = 0; i < INV_SIZE; i++) {
    const item = slots[i];
    const el = document.createElement('div');
    el.className = 'slot';
    el.dataset.inv = i;
    if (i < HOTBAR_SIZE) el.classList.add('hotbar-row');
    if (!item) el.classList.add('empty');
    el.innerHTML = slotHTML(item, i < HOTBAR_SIZE ? String(i + 1) : '');
    el.addEventListener('click', () => onInvSlotClick(i));
    grid.appendChild(el);
  }
}

function onInvSlotClick(i) {
  // Если это слот из хотбара и он пуст — просто выбираем его
  if (selectedInvSlot === -1) {
    // Выбираем активный слот (только из первых 6)
    if (i < HOTBAR_SIZE) {
      selectSlot(i);
      selectedInvSlot = -1;
      renderInventory();
    } else if (slots[i]) {
      // Выбрали предмет из глубины — запомним для перемещения
      selectedInvSlot = i;
      renderInventory();
    }
  } else {
    // Уже что-то выбрано — перемещаем/меняем
    if (selectedInvSlot === i) {
      selectedInvSlot = -1;
    } else {
      // Swap
      const tmp = slots[selectedInvSlot];
      slots[selectedInvSlot] = slots[i];
      slots[i] = tmp;
      selectedInvSlot = -1;
    }
    renderHotbar();
    renderInventory();
    updateHeldItem();
  }
}

function selectSlot(n) {
  activeSlot = n;
  renderHotbar();
  renderInventory();
  updateHeldItem();
}

document.querySelectorAll('#hotbar .slot').forEach((el, i) => {
  el.addEventListener('click', () => selectSlot(i));
});

function toggleInventory() {
  const modal = document.getElementById('invModal');
  if (modal.classList.contains('show')) {
    modal.classList.remove('show');
    selectedInvSlot = -1;
    if (!isMobile) {
      try { renderer.domElement.requestPointerLock(); } catch(e) {}
    }
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    modal.classList.add('show');
    selectedInvSlot = -1;
    renderInventory();
  }
}
document.getElementById('openInvBtn').addEventListener('click', toggleInventory);
document.getElementById('invClose').addEventListener('click', toggleInventory);

// ============ МОДЕЛИ ПРЕДМЕТОВ ============
function buildItemMesh(id) {
  const g = new THREE.Group();
  if (id === 'stone') {
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7a7a7a, roughness: 0.9 });
    const s = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12, 0), stoneMat);
    s.rotation.set(0.3, 0.5, 0.2);
    g.add(s);
    const s2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.06, 0), stoneMat);
    s2.position.set(0.08, 0.04, 0.03);
    g.add(s2);
  } else if (id === 'wood') {
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.32, 8), woodMat);
    log.rotation.z = Math.PI / 2;
    g.add(log);
    // Кольца на торцах
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1a });
    const r1 = new THREE.Mesh(new THREE.CircleGeometry(0.09, 8), ringMat);
    r1.position.x = 0.16; r1.rotation.y = Math.PI / 2;
    g.add(r1);
    const r2 = new THREE.Mesh(new THREE.CircleGeometry(0.09, 8), ringMat);
    r2.position.x = -0.16; r2.rotation.y = -Math.PI / 2;
    g.add(r2);
  }
  return g;
}

// ============ РУКА ОТ ПЕРВОГО ЛИЦА ============
// Детальная рука с ладонью и пальцами. Видна ТОЛЬКО если в руке предмет.
let firstPersonArm = null;
let firstPersonHeld = null;

function createFirstPersonArm() {
  const root = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd7a8, roughness: 0.75 });

  // Предплечье — сужается к запястью
  const forearm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.075, 0.42, 8),
    skinMat
  );
  forearm.position.set(0, -0.16, 0);
  root.add(forearm);

  // Ладонь
  const palm = new THREE.Mesh(
    new THREE.BoxGeometry(0.11, 0.13, 0.06),
    skinMat
  );
  palm.position.set(0, 0.09, 0);
  root.add(palm);

  // 4 пальца
  for (let i = 0; i < 4; i++) {
    const finger = new THREE.Mesh(
      new THREE.BoxGeometry(0.022, 0.09, 0.04),
      skinMat
    );
    finger.position.set(-0.036 + i * 0.024, 0.19, 0.005);
    finger.rotation.x = -0.5; // загнуты вокруг предмета
    root.add(finger);
  }

  // Большой палец
  const thumb = new THREE.Mesh(
    new THREE.BoxGeometry(0.03, 0.07, 0.035),
    skinMat
  );
  thumb.position.set(0.065, 0.12, 0.02);
  thumb.rotation.z = 0.6;
  thumb.rotation.x = -0.4;
  root.add(thumb);

  // Позиционирование руки в кадре (правый нижний угол)
  root.position.set(0.35, -0.42, -0.55);
  root.rotation.set(-0.35, -0.25, 0.15);

  // Группа для предмета — в ладони
  const held = new THREE.Group();
  held.position.set(0, 0.16, 0.04);
  held.scale.set(1.3, 1.3, 1.3);
  root.add(held);

  return { root, held };
}

function updateHeldItem() {
  const activeId = getActiveItem();

  // Своя рука от первого лица — видна только если есть предмет
  if (firstPersonArm) {
    const showArm = !!activeId && !player.thirdPerson && player.awake;
    firstPersonArm.root.visible = showArm;
    firstPersonHeld.clear();
    if (activeId) {
      firstPersonHeld.add(buildItemMesh(activeId));
    }
  }

  // Своя модель от третьего лица
  if (myThirdPersonModel) {
    myThirdPersonModel.setHeldItem(activeId);
  }
}

// ============ МОДЕЛЬКА (от третьего лица / у других) ============
function createHumanoid(name, color, deviceIcon) {
  const body = new THREE.Group();
  const g = new THREE.Group();
  g.add(body);

  const skinColor = new THREE.Color(0xffd7a8);
  const shortsColor = new THREE.Color(color).multiplyScalar(0.85);
  const shoeColor = new THREE.Color(0x2a2a2a);
  const hairColor = new THREE.Color(0x3a2a1a);

  const skinMat   = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.8 });
  const shortsMat = new THREE.MeshStandardMaterial({ color: shortsColor, roughness: 0.9 });
  const shoeMat   = new THREE.MeshStandardMaterial({ color: shoeColor, roughness: 0.7 });
  const hairMat   = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });
  const shadow = !isMobile;

  const thighLen = 0.45;
  const shinLen  = 0.35;

  const legL = new THREE.Group();
  legL.position.set(-0.14, 0.75, 0);
  const thighL = new THREE.Mesh(new THREE.BoxGeometry(0.22, thighLen, 0.22), shortsMat);
  thighL.position.y = -thighLen/2; thighL.castShadow = shadow; legL.add(thighL);
  const shinL = new THREE.Mesh(new THREE.BoxGeometry(0.18, shinLen, 0.18), skinMat);
  shinL.position.y = -thighLen - shinLen/2; shinL.castShadow = shadow; legL.add(shinL);
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.12, 0.32), shoeMat);
  shoeL.position.set(0, -thighLen - shinLen - 0.06, 0.05); shoeL.castShadow = shadow; legL.add(shoeL);
  body.add(legL);

  const legR = new THREE.Group();
  legR.position.set(0.14, 0.75, 0);
  const thighR = new THREE.Mesh(new THREE.BoxGeometry(0.22, thighLen, 0.22), shortsMat);
  thighR.position.y = -thighLen/2; thighR.castShadow = shadow; legR.add(thighR);
  const shinR = new THREE.Mesh(new THREE.BoxGeometry(0.18, shinLen, 0.18), skinMat);
  shinR.position.y = -thighLen - shinLen/2; shinR.castShadow = shadow; legR.add(shinR);
  const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.12, 0.32), shoeMat);
  shoeR.position.set(0, -thighLen - shinLen - 0.06, 0.05); shoeR.castShadow = shadow; legR.add(shoeR);
  body.add(legR);

  const torsoY = 1.175;
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.32), skinMat);
  torso.position.y = torsoY; torso.castShadow = shadow; body.add(torso);

  const shorts = new THREE.Mesh(new THREE.BoxGeometry(0.57, 0.22, 0.34), shortsMat);
  shorts.position.y = 0.91; shorts.castShadow = shadow; body.add(shorts);

  const headY = 1.77;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.4, 0.36), skinMat);
  head.position.y = headY; head.castShadow = shadow; body.add(head);

  const hair = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.38), hairMat);
  hair.position.y = headY + 0.26; hair.castShadow = shadow; body.add(hair);

  const eyeGeo = new THREE.BoxGeometry(0.06, 0.08, 0.02);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.08, headY + 0.02, -0.19); body.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(0.08, headY + 0.02, -0.19); body.add(eyeR);

  const armLen = 0.6;
  const armPivotY = 1.45;

  const armL = new THREE.Group();
  armL.position.set(-0.36, armPivotY, 0);
  const armLMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, armLen, 0.16), skinMat);
  armLMesh.position.y = -armLen/2; armLMesh.castShadow = shadow; armL.add(armLMesh);
  const handL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), skinMat);
  handL.position.y = -armLen - 0.05; handL.castShadow = shadow; armL.add(handL);
  body.add(armL);

  const armR = new THREE.Group();
  armR.position.set(0.36, armPivotY, 0);
  const armRMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, armLen, 0.16), skinMat);
  armRMesh.position.y = -armLen/2; armRMesh.castShadow = shadow; armR.add(armRMesh);
  const handR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), skinMat);
  handR.position.y = -armLen - 0.05; handR.castShadow = shadow; armR.add(handR);
  body.add(armR);

  const heldGroup = new THREE.Group();
  heldGroup.position.set(0, -armLen - 0.1, 0);
  armR.add(heldGroup);

  const canvas = document.createElement('canvas');
  canvas.width = 384; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.roundRect(0, 0, 384, 96, 16); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${deviceIcon || '❓'} ${name}`, 192, 48);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas), depthTest: false
  }));
  sprite.scale.set(2.8, 0.7, 1);
  sprite.position.y = headY + 0.55;
  g.add(sprite);

  let phase = 0;
  let lying = false;
  let lyingBlend = 0;

  return {
    group: g,
    body,
    sprite,
    setHeldItem(id) {
      heldGroup.clear();
      if (id) heldGroup.add(buildItemMesh(id));
    },
    update(dt, moving) {
      const target = lying ? 1 : 0;
      lyingBlend += (target - lyingBlend) * Math.min(dt * 10, 1);
      body.rotation.x = -Math.PI / 2 * lyingBlend;
      body.position.y = 0.35 * lyingBlend;
      sprite.position.y = (headY + 0.55) - 1.4 * lyingBlend;

      const canWalk = !lying && moving;
      if (canWalk) {
        phase += dt * 10;
        const swing = Math.sin(phase) * 0.7;
        armL.rotation.x = swing; armR.rotation.x = -swing;
        legL.rotation.x = -swing; legR.rotation.x = swing;
      } else {
        armL.rotation.x *= 0.85; armR.rotation.x *= 0.85;
        legL.rotation.x *= 0.85; legR.rotation.x *= 0.85;
        phase = 0;
      }
    },
    setLying(v) { lying = v; },
    isLying() { return lying; },
  };
}

// ============ SUPABASE ============
let channel = null;
const others = new Map();
let myThirdPersonModel = null;

function connectRealtime(name) {
  document.getElementById('err').textContent = '';
  player.name = name;

  // Своя модель от третьего лица
  myThirdPersonModel = createHumanoid(player.name, new THREE.Color(player.color), DEVICE.icon);
  myThirdPersonModel.group.visible = false;
  scene.add(myThirdPersonModel.group);

  // Рука от первого лица (привязывается к камере)
  firstPersonArm = createFirstPersonArm();
  firstPersonHeld = firstPersonArm.held;
  camera.add(firstPersonArm.root);
  scene.add(camera);
  updateHeldItem();

  channel = supabase.channel(CHANNEL_NAME, {
    config: { broadcast: { self: false }, presence: { key: player.id } }
  });

  channel.on('broadcast', { event: 'player-move' }, ({ payload }) => {
    if (payload.id === player.id) return;
    const o = others.get(payload.id);
    if (o) {
      o.targetPos.set(payload.x, payload.y, payload.z);
      o.targetYaw = payload.yaw;
      if (typeof payload.lying === 'boolean' && payload.lying !== o.lying) {
        o.lying = payload.lying;
        o.model.setLying(payload.lying);
        updatePlayerList();
      }
      if (payload.held !== o.held) {
        o.held = payload.held;
        o.model.setHeldItem(payload.held);
      }
    }
  });

  channel.on('broadcast', { event: 'need-sync' }, ({ payload }) => {
    if (payload.id === player.id) return;
    channel.send({
      type: 'broadcast', event: 'player-move',
      payload: {
        id: player.id,
        x: player.pos.x, y: player.pos.y - player.height, z: player.pos.z,
        yaw: player.yaw, lying: player.lying, held: getActiveItem(),
      }
    });
  });

  channel.on('broadcast', { event: 'tree-hit' }, ({ payload }) => {
    if (payload.from === player.id) return;
    damageTree(payload.id, payload.from);
  });

  channel.on('broadcast', { event: 'tree-sync-request' }, ({ payload }) => {
    if (payload.id === player.id) return;
    channel.send({
      type: 'broadcast', event: 'tree-sync-response',
      payload: { target: payload.id, trees: trees.map(t => ({ id: t.id, hp: t.hp })) }
    });
  });
  channel.on('broadcast', { event: 'tree-sync-response' }, ({ payload }) => {
    if (payload.target !== player.id) return;
    for (const info of payload.trees) {
      const t = treeMap.get(info.id);
      if (!t) continue;
      if (info.hp <= 0) removeTreeById(info.id);
      else t.hp = info.hp;
    }
  });

  channel.on('presence', { event: 'sync' }, () => {
    const state = channel.presenceState();
    const currentIds = new Set();
    for (const id in state) {
      if (id === player.id) continue;
      currentIds.add(id);
      const meta = state[id][0] || {};
      if (!others.has(id)) {
        addPlayer(id, {
          name: meta.name || 'Player',
          color: meta.color || '#888',
          device: meta.device || { icon: '❓', label: 'Unknown' },
          x: meta.x || 0, y: meta.y || 0, z: meta.z || 0, yaw: meta.yaw || 0,
          lying: !!meta.lying,
          held: meta.held || null,
        });
      } else {
        const o = others.get(id);
        if (typeof meta.lying === 'boolean' && meta.lying !== o.lying) {
          o.lying = meta.lying;
          o.model.setLying(meta.lying);
        }
        if (meta.held !== o.held) {
          o.held = meta.held;
          o.model.setHeldItem(meta.held);
        }
      }
    }
    for (const id of others.keys()) {
      if (!currentIds.has(id)) removePlayer(id);
    }
    updatePlayerList();
  });

  channel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      console.log('Connected to Supabase Realtime');
      player.subscribed = true;

      await channel.track({
        name: player.name, color: player.color,
        device: { icon: DEVICE.icon, label: DEVICE.label, detail: DEVICE.detail },
        x: player.pos.x, y: player.pos.y - player.height, z: player.pos.z,
        yaw: player.yaw, lying: true, held: getActiveItem(),
      });

      setTimeout(() => {
        if (channel && player.subscribed) {
          channel.send({ type: 'broadcast', event: 'need-sync', payload: { id: player.id } });
          channel.send({ type: 'broadcast', event: 'tree-sync-request', payload: { id: player.id } });
        }
      }, 150);

      document.getElementById('menu').style.display = 'none';
      document.getElementById('crosshair').style.display = 'block';
      document.getElementById('hotbar').style.display = 'flex';
      renderHotbar();
      showWakeOverlay();
      if (isMobile) enableTouchUI();
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      document.getElementById('err').textContent = 'Ошибка подключения. Проверь настройки Realtime.';
    }
  });
}

function addPlayer(id, data) {
  if (others.has(id)) return;
  const color = new THREE.Color(data.color || 0x888888);
  const devIcon = data.device ? data.device.icon : '❓';
  const model = createHumanoid(data.name || 'Player', color, devIcon);
  model.group.position.set(data.x || 0, data.y || 0, data.z || 0);
  model.group.rotation.y = data.yaw || 0;
  model.setLying(!!data.lying);
  model.setHeldItem(data.held);
  scene.add(model.group);
  others.set(id, {
    model,
    targetPos: new THREE.Vector3(data.x || 0, data.y || 0, data.z || 0),
    targetYaw: data.yaw || 0,
    name: data.name || 'Player',
    device: data.device || null,
    lying: !!data.lying,
    held: data.held || null,
  });
  updatePlayerList();
}

function removePlayer(id) {
  const o = others.get(id);
  if (o) { scene.remove(o.model.group); others.delete(id); }
  updatePlayerList();
}

function updatePlayerList() {
  let html = '<b>Игроки:</b><br>';
  for (const o of others.values()) {
    const d = o.device;
    const devStr = d ? `${d.icon} ${d.label}` : '❓';
    html += `<div class="row"><span class="dev">${devStr}</span></div>`;
    const sleepMark = o.lying ? ' <span class="sleeping">😴</span>' : '';
    html += `<div class="row">• ${o.name}${sleepMark}</div>`;
  }
  document.getElementById('players').innerHTML = html;
  document.getElementById('hud').textContent = `🏝️ ${others.size + 1}`;
}

let lastSend = 0;
let lastHeld = undefined;
function sendMove() {
  if (!channel || !player.subscribed) return;
  const now = performance.now();
  const active = getActiveItem();
  if (active !== lastHeld) {
    lastHeld = active;
    channel.track({
      name: player.name, color: player.color,
      device: { icon: DEVICE.icon, label: DEVICE.label, detail: DEVICE.detail },
      x: player.pos.x, y: player.pos.y - player.height, z: player.pos.z,
      yaw: player.yaw, lying: player.lying, held: active,
    }).catch(() => {});
    updateHeldItem();
  }
  if (now - lastSend < 50) return;
  lastSend = now;
  channel.send({
    type: 'broadcast', event: 'player-move',
    payload: {
      id: player.id,
      x: player.pos.x, y: player.pos.y - player.height, z: player.pos.z,
      yaw: player.yaw, lying: player.lying, held: active,
    }
  });
}

// ============ ПРОБУЖДЕНИЕ ============
const wakeOverlay = document.getElementById('wakeOverlay');
let wakingUp = false;

function showWakeOverlay() {
  player.pos.y = 0.4;
  player.pitch = 0.4;
  player.awake = false;
  player.lying = true;
  wakeOverlay.classList.add('show');

  const wakeHandler = () => {
    if (wakingUp) return;
    wakingUp = true;
    wakeOverlay.classList.remove('show');
    wakeOverlay.removeEventListener('click', wakeHandler);
    wakeOverlay.removeEventListener('touchstart', wakeHandler);

    const startY = player.pos.y;
    const startPitch = player.pitch;
    const targetY = 1.7;
    const targetPitch = -0.15;
    const dur = 900;
    const t0 = performance.now();

    player.lying = false;
    if (channel && player.subscribed) {
      channel.track({
        name: player.name, color: player.color,
        device: { icon: DEVICE.icon, label: DEVICE.label, detail: DEVICE.detail },
        x: player.pos.x, y: player.pos.y - player.height, z: player.pos.z,
        yaw: player.yaw, lying: false, held: getActiveItem(),
      }).catch(() => {});
      sendMove();
    }

    function animateWake() {
      const t = Math.min((performance.now() - t0) / dur, 1);
      const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
      player.pos.y = startY + (targetY - startY) * e;
      player.pitch = startPitch + (targetPitch - startPitch) * e;
      if (t < 1) requestAnimationFrame(animateWake);
      else {
        player.awake = true;
        wakingUp = false;
        updateHeldItem();
        if (!isMobile) { try { renderer.domElement.requestPointerLock(); } catch(e) {} }
      }
    }
    requestAnimationFrame(animateWake);
  };

  wakeOverlay.addEventListener('click', wakeHandler);
  wakeOverlay.addEventListener('touchstart', wakeHandler, { passive: true });
}

// ============ ТРЕТЬЕ ЛИЦО ============
function toggleThirdPerson() {
  player.thirdPerson = !player.thirdPerson;
  if (myThirdPersonModel) myThirdPersonModel.group.visible = player.thirdPerson;
  updateHeldItem();
}

// ============ УДАР ============
function tryHit() {
  if (!player.awake) return;
  const active = getActiveItem();
  if (active === 'stone') {
    let closest = null;
    let closestDist = HIT_RANGE;
    for (const t of trees) {
      const dx = player.pos.x - t.x;
      const dz = player.pos.z - t.z;
      const dist = Math.hypot(dx, dz);
      if (dist < closestDist) { closest = t; closestDist = dist; }
    }
    if (closest) {
      damageTree(closest.id, player.id);
      if (channel && player.subscribed) {
        channel.send({ type: 'broadcast', event: 'tree-hit', payload: { id: closest.id, from: player.id } });
      }
      showToast(`⛏ Удар (${closest.hp > 0 ? closest.hp : 'разрушено'})`);
      // Анимация замаха
      if (firstPersonArm && firstPersonArm.root.visible) {
        const orig = firstPersonArm.root.rotation.x;
        firstPersonArm.root.rotation.x = orig - 0.5;
        setTimeout(() => { if (firstPersonArm) firstPersonArm.root.rotation.x = orig; }, 120);
      }
    }
  } else if (active === 'wood') {
    showToast('Древесиной нельзя рубить — нужен камень');
  } else {
    showToast('В руке пусто');
  }
}

// ============ КОЛЛИЗИИ ============
function collidesWithTrees(x, z) {
  for (const t of trees) {
    const dx = x - t.x;
    const dz = z - t.z;
    const r = t.collider.r + 0.35;
    if (dx*dx + dz*dz < r*r) return true;
  }
  return false;
}

// ============ ОБНОВЛЕНИЕ ============
const speed = 6, runSpeed = 10, jumpForce = 7, gravity = 20;

function update(dt) {
  if (!player.awake) {
    camera.position.copy(player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    for (const o of others.values()) {
      o.model.group.position.lerp(o.targetPos, 0.35);
      o.model.group.rotation.y = o.targetYaw;
      o.model.update(dt, false);
    }
    if (myThirdPersonModel) {
      myThirdPersonModel.group.position.set(player.pos.x, 0, player.pos.z);
      myThirdPersonModel.group.rotation.y = player.yaw;
      myThirdPersonModel.setLying(true);
      myThirdPersonModel.update(dt, false);
    }
    return;
  }

  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right   = new THREE.Vector3( Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const dir = new THREE.Vector3();

  if (keys['KeyW']) dir.add(forward);
  if (keys['KeyS']) dir.sub(forward);
  if (keys['KeyD']) dir.add(right);
  if (keys['KeyA']) dir.sub(right);

  if (isMobile && (touchState.moveX || touchState.moveY)) {
    dir.add(forward.clone().multiplyScalar(-touchState.moveY));
    dir.add(right.clone().multiplyScalar(touchState.moveX));
  }

  if (dir.lengthSq() > 0) dir.normalize();

  const running = keys['ShiftLeft'] || keys['ShiftRight'];
  const spd = running ? runSpeed : speed;

  const nx = player.pos.x + dir.x * spd * dt;
  const nz = player.pos.z + dir.z * spd * dt;
  const distFromCenter = Math.hypot(nx, nz);

  if (distFromCenter <= WALK_LIMIT) {
    if (!collidesWithTrees(nx, player.pos.z)) player.pos.x = nx;
    if (!collidesWithTrees(player.pos.x, nz)) player.pos.z = nz;
  }

  const jumpInput = keys['Space'] || touchState.jump;
  if (jumpInput && player.onGround) {
    player.vel.y = jumpForce;
    player.onGround = false;
  }
  player.vel.y -= gravity * dt;
  const newY = player.pos.y + player.vel.y * dt;
  if (newY <= player.height) {
    player.pos.y = player.height;
    player.vel.y = 0;
    player.onGround = true;
  } else {
    player.pos.y = newY;
    player.onGround = false;
  }

  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Третье лицо
  if (player.thirdPerson && myThirdPersonModel) {
    myThirdPersonModel.group.position.set(player.pos.x, 0, player.pos.z);
    myThirdPersonModel.group.rotation.y = player.yaw;
    myThirdPersonModel.setLying(player.lying);
    myThirdPersonModel.update(dt, dir.lengthSq() > 0);

    const camDist = 4;
    const camHeight = 2.5;
    const cx = player.pos.x + Math.sin(player.yaw) * camDist;
    const cz = player.pos.z + Math.cos(player.yaw) * camDist;
    camera.position.set(cx, player.pos.y + camHeight - 1.7, cz);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = -0.3;
  }

  for (const o of others.values()) {
    const before = o.model.group.position.clone();
    o.model.group.position.lerp(o.targetPos, 0.35);
    o.model.group.rotation.y = o.targetYaw;
    const moved = before.distanceTo(o.model.group.position);
    o.model.update(dt, moved > 0.01);
  }

  // Tooltip над деревьями
  const tooltip = document.getElementById('tooltip');
  if (getActiveItem() === 'stone') {
    let near = null;
    let nearDist = HIT_RANGE;
    for (const t of trees) {
      const d = Math.hypot(player.pos.x - t.x, player.pos.z - t.z);
      if (d < nearDist) { near = t; nearDist = d; }
    }
    if (near) {
      const v = new THREE.Vector3(near.x, near.scale * 4, near.z);
      v.project(camera);
      if (v.z < 1) {
        const sx = (v.x * 0.5 + 0.5) * innerWidth;
        const sy = (-v.y * 0.5 + 0.5) * innerHeight;
        tooltip.style.left = sx + 'px';
        tooltip.style.top = sy + 'px';
        tooltip.style.display = 'block';
        tooltip.textContent = isMobile ? `🌳 ${near.hp} HP · HIT` : `🌳 ${near.hp} HP · ЛКМ`;
      } else tooltip.style.display = 'none';
    } else tooltip.style.display = 'none';
  } else tooltip.style.display = 'none';
}

// ============ ЦИКЛ ============
let last = performance.now();
function animate(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (player.name) {
    update(dt);
    if (player.awake) sendMove();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ UI ============
document.getElementById('joinBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  connectRealtime(name);
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('joinBtn').click();
});

renderer.domElement.addEventListener('click', () => {
  if (!isMobile && player.name && player.awake && !mouseLocked &&
      !document.getElementById('invModal').classList.contains('show')) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('beforeunload', () => {
  if (channel) channel.untrack();
});

document.getElementById('hotbar').style.display = 'none';
</script>
